<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cogniva</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header class="top"><span class="sp"></span><button type="button" id="lang" class="link"></button><button type="button" id="theme" class="link"></button></header>
  <main class="center solo"><section class="card">
    <div class="brand">Cogniva</div><p class="sub" data-i="title"></p>
    <form id="form" novalidate>
      <label for="name" data-i="name"></label><input id="name" type="text" autocomplete="name"><div class="err" id="eName"></div>
      <label for="email" data-i="email"></label><input id="email" type="email" autocomplete="email" inputmode="email"><div class="err" id="eEmail"></div>
      <label for="role" data-i="role"></label>
      <select id="role"><option value="student" data-i="student"></option><option value="teacher" data-i="teacher"></option></select>
      <label for="pw" data-i="password"></label>
      <div class="pw"><input id="pw" type="password" autocomplete="new-password"><button type="button" class="link tg" data-for="pw" data-all="pw,pw2"></button></div>
      <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div><div class="sTxt" id="sTxt"></div><div class="err" id="ePw"></div>
      <label for="pw2" data-i="confirm"></label><input id="pw2" type="password" autocomplete="new-password"><div class="err" id="ePw2"></div>
      <label class="check"><input type="checkbox" id="terms"><span data-i="terms"></span></label><div class="err" id="eTerms"></div>
      <div class="alert" id="alert" role="alert" hidden></div>
      <button class="btn" id="go" type="submit"></button>
    </form>
    <div class="or"><span data-i="or"></span></div>
      <div class="social"><a class="sbtn" id="gg" href="/auth/google" title="Google" aria-label="Google"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.700 15.100 19 12 24 12c3.100 0 5.800 1.200 8 3l5.700-5.700C34 6.100 29.300 4 24 4 16.300 4 9.700 8.300 6.300 14.700z"/><path fill="#4CAF50" d="M24 44c5.200 0 9.900-2 13.400-5.200l-6.200-5.200C29.200 35.100 26.700 36 24 36c-5.200 0-9.600-3.300-11.300-7.900l-6.500 5C9.500 39.600 16.200 44 24 44z"/><path fill="#1976D2" d="M43.600 20.100H42V20H24v8h11.300c-.8 2.200-2.200 4.200-4.100 5.600l6.200 5.200C37 39.200 44 34 44 24c0-1.300-.1-2.600-.4-3.900z"/></svg><span data-i="google"></span></a><a class="sbtn" id="gh" href="/auth/github" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span data-i="github"></span></a></div>
    <div class="links"><a href="index.html" data-i="have"></a></div>
  </section></main>
  <script src="common.js"></script><script src="register.js"></script>
</body></html>
