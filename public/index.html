<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cogniva</title>
  <link rel="stylesheet" href="style.css">
  <script>/* play the logo intro on a fresh visit only (not when coming back from our other pages, not after an auth error, not with reduced motion) */
    (function(){var r=document.referrer,same=false;try{same=r&&new URL(r).host===location.host}catch(e){}
    if(!same&&!/auth_error/.test(location.search)&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.documentElement.classList.add('intro')})();</script>
</head>
<body>
  <div id="intro" aria-hidden="true">
    <div class="ibg"></div>
    <svg id="ilogo" viewBox="0 0 64 64"><defs><linearGradient id="ilg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lc)"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><path class="arc" pathLength="1" d="M48.85 17.86A22 22 0 1 0 48.85 46.14"/><circle class="dot" cx="46" cy="32" r="4.5"/></svg>
    <div id="iword">Cogniva</div>
  </div>
  <header class="top">
    <span class="lbl" data-i="color"></span>
    <div class="colors" id="colors" role="group"></div>
    <input type="color" id="custom" aria-label="Custom color">
    <span class="sp"></span>
    <button type="button" id="lang" class="link"></button>
    <button type="button" id="theme" class="link"></button>
  </header>

  <main class="stage" id="stage">
    <div class="lampcol">
      <div class="glow" aria-hidden="true"></div>
      <svg id="lampSvg" viewBox="0 0 300 480" role="img" aria-label="Lamp with pull cord">
        <defs>
          <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--lc);stop-opacity:.45"/>
            <stop offset="1" style="stop-color:var(--lc);stop-opacity:0"/>
          </linearGradient>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--lc)"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
          <filter id="soft" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="5"/></filter>
        </defs>
        <line x1="150" y1="0" x2="150" y2="72" class="wire"/>
        <rect x="139" y="70" width="22" height="20" rx="4" class="cap"/>
        <polygon id="beam" points="130,214 170,214 285,470 15,470" fill="url(#beamGrad)" filter="url(#soft)"/>
        <g transform="translate(107 318) scale(1.35)"><g id="logo" aria-hidden="true"><path d="M48.85 17.86A22 22 0 1 0 48.85 46.14" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round"/><circle cx="46" cy="32" r="4.5" fill="var(--lc)"/></g></g>
        <circle id="bulb" cx="150" cy="206" r="17"/>
        <path d="M92 192 C92 122 120 88 150 88 C180 88 208 122 208 192 Z" class="shade"/>
        <rect x="86" y="190" width="128" height="8" rx="4" class="rim"/>
        <line id="cord" x1="196" y1="198" x2="196" y2="348" class="cord"/>
        <g id="knobG" tabindex="0" role="button" aria-pressed="false" aria-label="Pull the cord">
          <circle id="grab" cx="196" cy="348" r="30" fill="transparent"/>
          <circle id="knob" cx="196" cy="348" r="11"/>
        </g>
      </svg>
      <p class="hint" id="hint" aria-live="polite"></p>
    </div>

    <section class="card" id="card">
      <div class="brand">Cogniva</div>
      <p class="sub" data-i="sub"></p>
      <form id="form" novalidate>
        <label for="email" data-i="email"></label>
        <input id="email" type="email" autocomplete="email" inputmode="email">
        <div class="err" id="eEmail"></div>

        <label for="pw" data-i="password"></label>
        <div class="pw">
          <input id="pw" type="password" autocomplete="current-password">
          <button type="button" id="toggle" class="link"></button>
        </div>
        <div class="err" id="ePw"></div>

        <div class="alert" id="alert" role="alert" hidden></div>
        <button class="btn" id="go" type="submit"></button>
      </form>
      <div class="or"><span data-i="or"></span></div>
      <div class="social"><a class="sbtn" id="gg" href="/auth/google" title="Google" aria-label="Google"><svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.700 15.100 19 12 24 12c3.100 0 5.800 1.200 8 3l5.700-5.700C34 6.100 29.300 4 24 4 16.300 4 9.700 8.300 6.300 14.700z"/><path fill="#4CAF50" d="M24 44c5.200 0 9.900-2 13.400-5.200l-6.200-5.200C29.200 35.100 26.700 36 24 36c-5.200 0-9.600-3.300-11.300-7.900l-6.500 5C9.500 39.600 16.200 44 24 44z"/><path fill="#1976D2" d="M43.600 20.100H42V20H24v8h11.300c-.8 2.200-2.200 4.200-4.100 5.600l6.200 5.200C37 39.200 44 34 44 24c0-1.300-.1-2.600-.4-3.900z"/></svg><span data-i="google"></span></a><a class="sbtn" id="gh" href="/auth/github" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span data-i="github"></span></a></div>
      <div class="links"><a href="forgot.html" data-i="forgot"></a><a href="register.html" data-i="newAcc"></a></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
