app = "cogniva-CHANGE-ME"
primary_region = "fra"

[build]

[env]
  SITE_URL = "https://cogniva-CHANGE-ME.fly.dev"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
