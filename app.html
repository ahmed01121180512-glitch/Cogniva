<style>
:root{--bg:#0B1726;--bg2:#142B43;--sf:#14263A;--el:#20384F;--pr:#2563EB;--ac:#3B82F6;--cy:#38BDF8;--teal:#14B8A6;--tx:#F8FAFC;--tx2:#A8B7C8;--mu:#71849A;--bd:rgba(148,163,184,.16);--ok:#14B8A6;--er:#f87171;--g1:.46;--g2:.85}

*{box-sizing:border-box}
body{margin:0;font:14px/1.6 Inter,"IBM Plex Sans Arabic",Cairo,system-ui,sans-serif;color:var(--tx);min-height:100vh;background:linear-gradient(135deg,var(--bg),var(--bg2)) fixed;overflow-x:hidden}

body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:56px 56px;opacity:.4;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%)}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes spin{to{--ang:360deg}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes dashin{from{stroke-dasharray:0 100}}
@keyframes fill{from{width:0}}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(56,189,248,0)}}
.app{display:flex;min-height:100vh}
aside{position:relative;width:226px;padding:22px 14px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;background:linear-gradient(180deg,rgba(20,38,58,.55),transparent);backdrop-filter:blur(6px)}
aside::after{content:'';position:absolute;inset-block:0;inset-inline-end:0;width:1px;background:linear-gradient(transparent,var(--cy),var(--pr),transparent);opacity:.55}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:0 10px 6px;text-shadow:0 0 22px rgba(56,189,248,.45)}
.logo{display:block;width:46px;height:46px;margin:0 10px 18px;filter:drop-shadow(0 0 10px rgba(56,189,248,.6));animation:glowpulse 4s ease-in-out infinite}
@keyframes glowpulse{50%{filter:drop-shadow(0 0 18px rgba(56,189,248,.95))}}
nav button{all:unset;display:block;width:100%;padding:9px 12px;border-radius:9px;color:var(--tx2);cursor:pointer;position:relative;transition:.2s}
nav button:hover{background:var(--el);color:var(--tx);transform:translateX(3px)}
[dir=rtl] nav button:hover{transform:translateX(-3px)}
nav button.on{background:linear-gradient(90deg,rgba(56,189,248,.16),transparent);color:var(--cy);text-shadow:0 0 12px rgba(56,189,248,.6)}
nav button.on::before{content:'';position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--cy);box-shadow:0 0 12px var(--cy)}
.ctl{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding:10px}
main{flex:1;padding:30px 34px;max-width:1120px;min-width:0}
main>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}main>*:nth-child(n+6){animation-delay:.3s}
h1{font-size:26px;margin:0 0 20px;font-weight:650;letter-spacing:-.01em}h2{font-size:15px;margin:26px 0 10px;color:var(--tx2);font-weight:600}
h3{margin:0 0 12px;font-size:12px;color:var(--mu);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.btn{background:linear-gradient(90deg,var(--pr),var(--ac));color:#fff;border:0;padding:8px 15px;border-radius:9px;font:inherit;font-weight:550;cursor:pointer;transition:.2s}
.btn:hover{box-shadow:0 0 22px rgba(56,189,248,.5);transform:translateY(-1px)}.btn:active{transform:none}.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx2)}.btn.ghost:hover{color:var(--tx);background:var(--el);box-shadow:0 0 14px rgba(56,189,248,.25)}.btn.sm{padding:4px 10px;font-size:12px}

input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(56,189,248,.18),0 0 16px rgba(56,189,248,.25)}
label{display:block;margin:12px 0 5px;color:var(--tx2);font-size:12.5px}

.tiles>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}

.tile::after,.panel::after{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--sf)}
.tile::before,.panel::before{content:'';position:absolute;inset:-2px;z-index:-2;border-radius:16px;background:conic-gradient(from var(--ang),var(--cy),var(--pr),var(--teal),var(--cy));filter:blur(17px);opacity:var(--g1);animation:spin 7s linear infinite;transition:opacity .3s}

.panel{padding:18px;margin-top:14px}
